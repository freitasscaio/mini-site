  <style>
    /* ============================================================
       1) VARIÁVEIS — troque os valores aqui para mudar todo o visual
       ============================================================ */
    :root {
      --bg: #050914;
      /* fundo azul bem escuro */
      --bg-deep: #01030a;
      /* fundo quase preto (bordas da tela) */
      --accent: #4fb3ff;
      /* azul claro de destaque */
      --accent-strong: #1f8ef0;
      --accent-soft: rgba(79, 179, 255, .18);
      /* brilho azul suave */
      --highlight: #ffb154;
      /* detalhe laranja/amarelo (hover) */
      --text: #eaf3ff;
      --text-muted: #7f95b5;
      --btn-bg: rgba(255, 255, 255, .045);
      --btn-bg-hover: rgba(79, 179, 255, .13);
      --btn-border: rgba(79, 179, 255, .26);
      --btn-border-hover: rgba(255, 177, 84, .7);
      --glow: rgba(79, 179, 255, .35);
      --shadow: 0 10px 30px -14px rgba(0, 0, 0, .9);
      --radius: 22px;
      --maxw: 480px;
      /* largura máxima do conteúdo */
    }

    /* ============================================================
       2) BASE
       ============================================================ */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(120% 90% at 50% -10%, #0b2545 0%, var(--bg) 45%, var(--bg-deep) 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 40px 20px 28px;
      overflow-x: hidden;
    }

    /* ============================================================
       3) FUNDO — ondas tipo mapa topográfico (SVG inline)
       ============================================================ */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* movimento bem lento das ondas */
    .bg__waves {
      animation: drift 46s ease-in-out infinite alternate;
      transform-origin: 60% 40%;
    }

    /* camada escura por cima para dar profundidade às ondas */
    .bg__veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(90% 60% at 50% 12%, rgba(5, 9, 20, 0) 0%, rgba(5, 9, 20, .72) 70%, rgba(1, 3, 10, .95) 100%);
    }

    /* ============================================================
       3b) FUNDO GAMER — ícones flutuando + pixels piscando
       Camada acima do véu e atrás do conteúdo (main tem z-index 2)
       ============================================================ */
    .gamefield {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    /* Ícones de games: sobem devagar, com leve rotação e balanço lateral */
    .gamefield__item {
      position: absolute;
      bottom: -90px;
      left: var(--x, 50%);
      width: var(--size, 32px);
      height: var(--size, 32px);
      opacity: var(--alpha, .12);
      will-change: transform, opacity;
      animation: floatUp var(--dur, 26s) linear var(--delay, 0s) infinite;
    }

    .gamefield__item svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Pixels quadrados piscando suavemente */
    .gamefield__pixel {
      position: absolute;
      left: var(--x, 50%);
      top: var(--y, 50%);
      width: var(--size, 6px);
      height: var(--size, 6px);
      border-radius: 1px;
      opacity: .05;
      will-change: opacity;
      animation: blink var(--dur, 5s) ease-in-out var(--delay, 0s) infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) rotate(-6deg);
        opacity: 0;
      }

      12% {
        opacity: var(--alpha, .12);
      }

      50% {
        transform: translate3d(var(--sway, 30px), -55vh, 0) rotate(var(--spin, 20deg));
        opacity: var(--alpha, .12);
      }

      88% {
        opacity: var(--alpha, .12);
      }

      100% {
        transform: translate3d(0, -115vh, 0) rotate(-6deg);
        opacity: 0;
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: .04;
      }

      50% {
        opacity: .16;
      }
    }

    /* Economia de bateria: animações pausadas com a aba oculta */
    .gamefield.is-paused .gamefield__item,
    .gamefield.is-paused .gamefield__pixel {
      animation-play-state: paused;
    }

    /* ============================================================
       4) CONTEÚDO
       ============================================================ */
    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: var(--maxw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 34px;
      margin: auto;
    }

    /* Avatar circular (container faz a entrada, a imagem flutua) */
    .avatar {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(160deg, var(--accent) 0%, rgba(79, 179, 255, .08) 70%);
      box-shadow: 0 0 0 1px var(--btn-border), 0 0 38px var(--glow), var(--shadow);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(5, 9, 20, .9);
      animation: float 6.5s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 7vw, 1.9rem);
      font-weight: 600;
      letter-spacing: .3px;
      text-align: center;
      text-shadow: 0 0 26px var(--glow);
    }

    /* Lista de links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 62px;
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow), 0 0 22px -12px var(--glow);
      transition: transform .22s ease, background-color .22s ease, border-color .22s ease,
        box-shadow .22s ease, color .22s ease;
      will-change: transform;
    }

    .link__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      color: var(--accent);
      transition: color .22s ease, transform .22s ease;
    }

    .link__icon svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .link__label {
      line-height: 1.2;
    }

    /* Hover / toque: sobe, brilha mais e o ícone balança */
    .link:hover,
    .link:focus-visible {
      transform: translateY(-3px);
      background: var(--btn-bg-hover);
      border-color: var(--btn-border-hover);
      box-shadow: 0 16px 34px -16px rgba(0, 0, 0, .9), 0 0 34px -6px var(--glow);
    }

    .link:hover .link__icon,
    .link:focus-visible .link__icon {
      color: var(--highlight);
    }

    .link:hover .link__icon svg,
    .link:focus-visible .link__icon svg {
      animation: wiggle .45s ease;
    }

    .link:active {
      transform: translateY(-1px) scale(.97);
      transition-duration: .12s;
    }

    .link:focus-visible {
      outline: 2px solid var(--highlight);
      outline-offset: 3px;
    }

    /* ---------- Card de e-mail: mesmo visual dos botões ---------- */
    .link--email {
      text-align: left;
      gap: 13px;
    }

    .link__text {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1 1 auto;
    }

    .link__label-sm {
      font-size: .72rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .link__value {
      font-size: .95rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      word-break: break-all;
    }

    .link__hint {
      margin-top: 2px;
      font-size: .72rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--accent);
      transition: color .2s ease;
    }

    .link__hint.is-copied {
      color: var(--highlight);
    }

    footer {
      margin-top: 6px;
      font-size: .78rem;
      font-weight: 400;
      color: var(--text-muted);
      text-align: center;
    }

    /* ============================================================
       5) ANIMAÇÕES
       ============================================================ */
    /* entrada em cascata: fade + subida suave */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: rise .7s cubic-bezier(.22, .61, .36, 1) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* flutuação contínua do avatar */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    /* ondas do fundo se movendo devagar */
    @keyframes drift {
      from {
        transform: translate3d(-2%, -1.5%, 0) scale(1.04);
      }

      to {
        transform: translate3d(2%, 1.5%, 0) scale(1.08);
      }
    }

    /* balançada discreta do ícone */
    @keyframes wiggle {
      0% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-9deg);
      }

      60% {
        transform: rotate(7deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    /* Acessibilidade: sem movimento para quem prefere menos animação */
    @media (prefers-reduced-motion: reduce) {

      .reveal,
      .avatar img,
      .bg__waves,
      .link__icon svg {
        animation: none !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }

      .link,
      .link:hover,
      .link:focus-visible {
        transition: none;
      }

      .link:hover,
      .link:focus-visible {
        transform: none;
      }

      .link:active {
        transform: none;
        transition: none;
      }

      .link__hint {
        transition: none;
      }

      /* fundo gamer parado, só com opacidade baixa */
      .gamefield__item,
      .gamefield__pixel {
        animation: none !important;
      }

      .gamefield__item {
        opacity: var(--alpha, .12);
      }

      .gamefield__pixel {
        opacity: .05;
      }
    }

    /* Ajustes finos para telas pequenas */
    @media (max-width: 380px) {
      .avatar {
        width: 104px;
        height: 104px;
      }

      .link {
        padding: 14px 16px;
        gap: 12px;
        font-size: .95rem;
      }

      .link__value {
        font-size: .82rem;
      }
    }
  </style>

  <script>
    /* habilita as animações só depois que o CSS carregar (evita piscar) */
    document.documentElement.classList.add("js");
  </script>
</head>

    (function () {
      "use strict";

      /* O endereço é montado aqui e escrito na tela pelo JS, assim a
         hospedagem não esconde nem transforma o e-mail. */
      var EMAIL = ["contatoc4feziin", "@", "gmail.com"].join("");
      var HINT_DEFAULT = "Toque para copiar";
      var HINT_COPIED = "Copiado!";

      var emailCard = document.getElementById("email-card");
      var emailValue = document.getElementById("email-value");
      var emailHint = document.getElementById("email-hint");
      var hintTimer = null;

      if (emailValue) {
        emailValue.textContent = EMAIL;
      }

      /* Feedback "Copiado!" por 2 segundos */
      function showCopied() {
        if (!emailHint) return;
        emailHint.textContent = HINT_COPIED;
        emailHint.classList.add("is-copied");
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () {
          emailHint.textContent = HINT_DEFAULT;
          emailHint.classList.remove("is-copied");
        }, 2000);
      }

      /* Cópia de reserva (textarea + execCommand) quando a Clipboard API falha */
      function legacyCopy(text) {
        var field = document.createElement("textarea");
        field.value = text;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.top = "-1000px";
        document.body.appendChild(field);
        field.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(field);
        if (!ok) throw new Error("copy failed");
      }

      /* Tenta a Clipboard API e cai no fallback se não funcionar */
      function copyEmail() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(EMAIL).catch(function () {
            legacyCopy(EMAIL);
          });
        }
        try {
          legacyCopy(EMAIL);
          return Promise.resolve();
        } catch (err) {
          return Promise.reject(err);
        }
      }

      if (emailCard) {
        emailCard.addEventListener("click", function () {
          copyEmail().then(showCopied).catch(function () {
            /* não deu para copiar: nenhum aviso é mostrado */
          });
        });
      }

      /* ==========================================================
         FUNDO GAMER
         Ícones genéricos em SVG inline (linha/outline), sem marcas,
         personagens ou itens de jogos existentes.
         ========================================================== */
      var gamefield = document.getElementById("gamefield");

      var ICON_BLUE = "#4da8ff";
      var ICON_ORANGE = "#ffb154";

      /* Envolve os caminhos em um SVG de linha que herda a cor do elemento */
      function icon(paths) {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
          'stroke-linecap="round" stroke-linejoin="round">' + paths + "</svg>";
      }

      /* Letras dos botões A/B/X/Y */
      function buttonLetter(letter, x, y) {
        return '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" ' +
          'font-family="Poppins, Arial, sans-serif" font-size="3.6" font-weight="600" ' +
          'fill="currentColor" stroke="none">' + letter + "</text>";
      }

      var ICONS = [
        /* controle de videogame */
        icon('<path d="M6.8 7.5h10.4a4 4 0 0 1 3.9 3.1l1 4.3a2.4 2.4 0 0 1-4.3 2.1L16.2 15.5H7.8L6.2 17a2.4 2.4 0 0 1-4.3-2.1l1-4.3a4 4 0 0 1 3.9-3.1Z"/>' +
          '<path d="M9 11v3M7.5 12.5h3"/><circle cx="15.5" cy="11.6" r=".9"/><circle cx="18" cy="13.6" r=".9"/>'),
        /* joystick de arcade */
        icon('<circle cx="12" cy="4.8" r="2.1"/><path d="M12 6.9v6.2"/>' +
          '<path d="M6.8 19.7h10.4v-2.2a1.7 1.7 0 0 0-1.7-1.7H8.5a1.7 1.7 0 0 0-1.7 1.7z"/><path d="M4.5 21.6h15"/>'),
        /* d-pad */
        icon('<path d="M9.8 3.5h4.4v6.3h6.3v4.4h-6.3v6.3H9.8v-6.3H3.5V9.8h6.3z"/>'),
        /* botões A/B/X/Y */
        icon('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.4" r="2.4"/><circle cx="16.6" cy="12" r="2.4"/>' +
          '<circle cx="12" cy="16.6" r="2.4"/><circle cx="7.4" cy="12" r="2.4"/>' +
          buttonLetter("Y", 12, 7.4) + buttonLetter("B", 16.6, 12) +
          buttonLetter("A", 12, 16.6) + buttonLetter("X", 7.4, 12)),
        /* dado */
        icon('<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1"/>' +
          '<circle cx="15.5" cy="8.5" r="1"/><circle cx="12" cy="12" r="1"/>' +
          '<circle cx="8.5" cy="15.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/>'),
        /* fone de headset */
        icon('<path d="M4 14.5v-2a8 8 0 0 1 16 0v2"/><rect x="2.6" y="13.5" width="4.4" height="6.2" rx="2.2"/>' +
          '<rect x="17" y="13.5" width="4.4" height="6.2" rx="2.2"/><path d="M19.2 19.9v.2a2.2 2.2 0 0 1-2.2 2.2h-3.4"/>'),
        /* estrela */
        icon('<path d="M12 3.6l2.6 5.3 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9-4.3-4.1 5.9-.8z"/>'),
        /* coração de vida */
        icon('<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>'),
        /* moeda */
        icon('<circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.3"/><path d="M12 7.7v8.6"/>'),
        /* troféu */
        icon('<path d="M8 3.8h8v5.4a4 4 0 0 1-8 0z"/><path d="M8 5.4H5.4v2A3.1 3.1 0 0 0 8 10.5"/>' +
          '<path d="M16 5.4h2.6v2A3.1 3.1 0 0 1 16 10.5"/><path d="M12 13.2v4.1"/><path d="M9 20.2h6"/>' +
          '<path d="M10.4 20.2v-1.2a1.6 1.6 0 0 1 3.2 0v1.2"/>'),
        /* pixel / quadradinho */
        icon('<rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/>' +
          '<rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/>'),
        /* raio */
        icon('<path d="M13.2 2.6 5.6 13.4h5.1l-.9 8 7.6-10.8h-5.1z"/>')
      ];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      /* Monta os ícones e os pixels com posição, tamanho e atraso aleatórios */
      function buildGamefield() {
        if (!gamefield) return;

        var small = window.matchMedia("(max-width: 480px)").matches;
        var iconCount = small ? 12 : 18;
        var pixelCount = small ? 8 : 14;
        var offset = Math.floor(rand(0, ICONS.length));
        var frag = document.createDocumentFragment();
        var i, el, size, alpha, orange, offsetX;

        for (i = 0; i < iconCount; i++) {
          /* no celular os ícones ficam um pouco menores e mais discretos */
          size = Math.round(small ? rand(20, 40) : rand(20, 56));
          orange = Math.random() < 0.15;

          el = document.createElement("span");
          el.className = "gamefield__item";
          el.style.cssText =
            "--x:" + rand(2, 96).toFixed(2) + "%;" +
            "--size:" + size + "px;" +
            "--dur:" + rand(18, 40).toFixed(1) + "s;" +
            "--delay:-" + rand(0, 34).toFixed(1) + "s;" +
            "--sway:" + rand(-55, 55).toFixed(0) + "px;" +
            "--spin:" + rand(-28, 28).toFixed(0) + "deg;" +
            "--alpha:" + (orange ? 0.1 : small ? rand(0.06, 0.13) : rand(0.08, 0.18)).toFixed(3) + ";" +
            "color:" + (orange ? ICON_ORANGE : ICON_BLUE) + ";";
          el.innerHTML = ICONS[(i + offset) % ICONS.length];
          frag.appendChild(el);
        }

        for (i = 0; i < pixelCount; i++) {
          offsetX = rand(2, 97).toFixed(2);

          el = document.createElement("span");
          el.className = "gamefield__pixel";
          el.style.cssText =
            "--x:" + offsetX + "%;" +
            "--y:" + rand(4, 93).toFixed(2) + "%;" +
            "--size:" + Math.round(rand(4, 8)) + "px;" +
            "--dur:" + rand(3, 7).toFixed(1) + "s;" +
            "--delay:-" + rand(0, 5).toFixed(1) + "s;" +
            "background:" + (Math.random() < 0.15 ? ICON_ORANGE : ICON_BLUE) + ";";
          frag.appendChild(el);
        }

        gamefield.appendChild(frag);
      }

      buildGamefield();

      /* Pausa as animações do fundo quando a aba está oculta */
      document.addEventListener("visibilitychange", function () {
        if (gamefield) {
          gamefield.classList.toggle("is-paused", document.hidden);
        }
      });
    })();
  </script>
</body>

</html>
